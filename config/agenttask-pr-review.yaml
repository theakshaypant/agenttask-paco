# AgentTask CR referenced by the pipeline's "review" step. Takes a single
# "request" param, returns "outcome" and "analysis-result-name" results
# (analysis-v1 profile contract).
#
# Prerequisites: cluster-scoped Agent/tekton-analysis (with LLMProvider),
# agenttask + agenttask-adapter-lightspeed controllers running.
apiVersion: agent.tekton.dev/v1alpha1
kind: AgentTask
metadata:
  name: pr-review
  namespace: agenttask-paco
spec:
  description: >-
    Review a pull request's diff via the Lightspeed Agentic Operator,
    routed through the analysis-v1 profile (read-only, no remediation
    actions are ever taken against the cluster).
  params:
    - name: request
      type: string
  results:
    - name: outcome
      description: "action-required or no-action-required"
    - name: analysis-result-name
      description: Name of the native agentic.openshift.io/v1alpha1 AnalysisResult object.
  adapterRef:
    name: lightspeed.openshift.io/agenticrun
    params:
      - name: profile
        value: analysis-v1
