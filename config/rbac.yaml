# Grants the "default" ServiceAccount (the one Pipelines as Code actually runs
# PipelineRuns under in this namespace, since no dedicated "pipeline"
# ServiceAccount is configured):
# - create/get/list/watch on CustomRuns (to run the AgentTask)
# - get on AnalysisResult (to read Lightspeed output)
# Does not grant permission to create/patch/delete AgenticRun, Agent, or
# LLMProvider — translate-result only reads AnalysisResult.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agenttask-paco-pipeline
  namespace: default
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["customruns"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["agentic.openshift.io"]
    resources: ["analysisresults"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agenttask-paco-pipeline
  namespace: default
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
roleRef:
  kind: Role
  name: agenttask-paco-pipeline
  apiGroup: rbac.authorization.k8s.io
