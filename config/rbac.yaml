# Grants the pipeline's ServiceAccount permission to run the "review"
# AgentTask (create/get/list/watch CustomRuns of kind AgentTask, which the
# agenttask controller reconciles) and to read the AnalysisResult objects
# the real Lightspeed Agentic Operator produces.
#
# This does not grant any permission to create/patch/delete AgenticRun,
# Agent, LLMProvider, or any other Lightspeed-operator-owned resource -
# agenttask-paco's Tasks only ever read AnalysisResult, never drive the
# operator directly.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agenttask-paco-pipeline
  namespace: agenttask-paco
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["customruns"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["agentic.openshift.io"]
    resources: ["analysisresults"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agenttask-paco-pipeline
  namespace: agenttask-paco
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: agenttask-paco
roleRef:
  kind: Role
  name: agenttask-paco-pipeline
  apiGroup: rbac.authorization.k8s.io
