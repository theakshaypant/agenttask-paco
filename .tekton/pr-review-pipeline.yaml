# Replaces .tekton/paco.yaml's review step with an AgentTask CustomRun.
# Same triggers ("/paco review", PR open/reopen), same output (sticky
# comment + inline suggestions). Reuses paco-cli for diff/post; only the
# LLM analysis engine changes (AgentTask + Lightspeed instead of
# opencode/Vertex).
#
# PaC resolves build-request/translate-result/paco-diff/paco-post from
# .tekton/tasks/ automatically. The "review" step refs a namespace-scoped
# AgentTask CR (config/agenttask-pr-review.yaml) that must be pre-installed
# via kubectl apply -k config/.
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: agenttask-paco-review
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request" && target_branch == "main" && (body.action == "opened" || body.action == "reopened")
    pipelinesascode.tekton.dev/on-comment: "^/paco[[:space:]]+(review|summary)[[:space:]]*$"
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
spec:
  params:
    - name: repo_owner
      value: "{{repo_owner}}"
    - name: repo_name
      value: "{{repo_name}}"
    - name: pull_request_number
      value: "{{pull_request_number}}"
    - name: trigger_comment
      value: |
        {{ trigger_comment }}
    - name: comment_id
      value: "{{ cel: has(body.comment) && has(body.comment.id) ? string(body.comment.id) : '' }}"
    - name: git_auth_secret
      value: "{{git_auth_secret}}"
  pipelineSpec:
    params:
      - name: repo_owner
      - name: repo_name
      - name: pull_request_number
      - name: trigger_comment
      - name: comment_id
        default: ""
      - name: git_auth_secret
    workspaces:
      - name: source
    tasks:
      - name: paco-diff
        displayName: "Fetch PR diff via paco (real paco-cli, unmodified)"
        taskRef:
          name: paco-diff
        params:
          - name: repo_owner
            value: "$(params.repo_owner)"
          - name: repo_name
            value: "$(params.repo_name)"
          - name: pull_request_number
            value: "$(params.pull_request_number)"
          - name: comment_id
            value: "$(params.comment_id)"
          - name: git_auth_secret
            value: "$(params.git_auth_secret)"
        workspaces:
          - name: source
            workspace: source

      - name: build-request
        displayName: "Render the review request prompt"
        runAfter: ["paco-diff"]
        taskRef:
          name: build-request
        params:
          - name: trigger-comment
            value: "$(params.trigger_comment)"
        workspaces:
          - name: source
            workspace: source

      - name: review
        displayName: "Run the review via AgentTask + Lightspeed"
        runAfter: ["build-request"]
        when:
          - input: "$(tasks.build-request.results.skip)"
            operator: notin
            values: ["true"]
        taskRef:
          apiVersion: agent.tekton.dev/v1alpha1
          kind: AgentTask
          name: pr-review
        params:
          - name: request
            value: "$(tasks.build-request.results.request)"

      - name: translate-result
        displayName: "Translate the AnalysisResult into paco-cli's review schema"
        runAfter: ["review"]
        when:
          - input: "$(tasks.build-request.results.skip)"
            operator: notin
            values: ["true"]
        taskRef:
          name: translate-result
        params:
          - name: skip
            value: "$(tasks.build-request.results.skip)"
          - name: outcome
            value: "$(tasks.review.results.outcome)"
          - name: analysis-result-name
            value: "$(tasks.review.results.analysis-result-name)"
        workspaces:
          - name: source
            workspace: source

      - name: paco-post
        displayName: "Post the review to the pull request (real paco-cli, unmodified)"
        runAfter: ["translate-result", "build-request"]
        taskRef:
          name: paco-post
        params:
          - name: repo_owner
            value: "$(params.repo_owner)"
          - name: repo_name
            value: "$(params.repo_name)"
          - name: pull_request_number
            value: "$(params.pull_request_number)"
          - name: git_auth_secret
            value: "$(params.git_auth_secret)"
        workspaces:
          - name: source
            workspace: source
  workspaces:
    - name: source
      emptyDir: {}
